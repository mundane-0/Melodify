let LANG=PREF.lang||'fr';
function t(k){return (I18N[LANG]&&I18N[LANG][k])||I18N.fr[k]||k;}
function applyStaticI18n(){$$('[data-i18n]').forEach(e=>{e.textContent=t(e.getAttribute('data-i18n'));});$$('[data-i18n-ph]').forEach(e=>{e.setAttribute('placeholder',t(e.getAttribute('data-i18n-ph')));});$$('[data-i18n-title]').forEach(e=>{e.setAttribute('title',t(e.getAttribute('data-i18n-title')));});document.documentElement.lang=LANG;}

function applyFonts(){if(PREF.fontDisplay)root.style.setProperty('--display',PREF.fontDisplay);else root.style.removeProperty('--display');if(PREF.fontBody)root.style.setProperty('--body',PREF.fontBody);else root.style.removeProperty('--body');}
function applyRadius(){root.style.setProperty('--r',(PREF.radius!=null?PREF.radius:16)+'px');}
function applyBlur(){root.style.setProperty('--glass-blur',(PREF.blur!=null?PREF.blur:34));}
function applyLyrSize(){root.style.setProperty('--lyr-size',(PREF.lyrSize!=null?PREF.lyrSize:25));}
function applyLyrDims(){root.style.setProperty('--lyr-cov',(PREF.lyrCov!=null?PREF.lyrCov:72));root.style.setProperty('--lyr-side-w',(PREF.lyrSideW!=null?PREF.lyrSideW:42));}
function applyTheme(){var r=root.style;r.setProperty('--ambient-op',(PREF.ambientOp!=null?PREF.ambientOp:.92));r.setProperty('--tile-gap',(PREF.tileGap!=null?PREF.tileGap:18)+'px');r.setProperty('--tile-rad',(PREF.tileRad!=null?PREF.tileRad:14)+'px');}

function renderHome(){S.viewTracks=null;const ready=S.lib.tracks.filter(x=>x.status==='ready');const favs=ready.filter(x=>x.fav);$('#view').innerHTML=`<div class="view-head"><h2>${t('home.title')}</h2><span class="sub">${ready.length} ${t('home.titles')} · ${S.lib.playlists.length} ${t('home.playlists').toLowerCase()}</span></div>${favs.length?`<h3 style="font-family:var(--display);font-size:22px;margin:6px 0 14px">${t('home.favs')}</h3><div class="grid" style="margin-bottom:30px">${favs.slice(0,6).map(tileHTML).join('')}</div>`:''}${S.lib.playlists.length?`<h3 style="font-family:var(--display);font-size:22px;margin:6px 0 14px">${t('home.playlists')}</h3><div class="grid" style="margin-bottom:30px">${S.lib.playlists.map(p=>`<div class="tile" data-pl="${p.id}"><div class="cov">${(STORE.get('plcov_'+p.id)||p.cover)?`<img src="${STORE.get('plcov_'+p.id)||p.cover||''}">`:''}</div><h3>${esc(p.name)}</h3><p>${p.tracks.length} ${t('home.titles')}</p></div>`).join('')}</div>`:''}<h3 style="font-family:var(--display);font-size:22px;margin:6px 0 14px">${t('home.recent')}</h3>${ready.length?`<div class="grid">${ready.slice(0,12).map(tileHTML).join('')}</div>`:`<div class="empty">${t('home.empty')}</div>`}`;}
function renderSearch(){S.viewTracks=null;$('#view').innerHTML=`<div class="view-head"><h2>${t('search.title')}</h2><span class="sub">${t('search.sub')}</span></div><div class="field" style="max-width:640px"><input id="srch" placeholder="${esc(t('search.ph'))}" value="${esc(lastQ)}"></div><div id="sres" class="grid"></div>`;}
function directTile(q){return `<div class="tile direct in" data-id="" data-q="${esc(q)}" data-title="${esc(q)}" data-artist="${esc(t('search.direct_artist'))}" data-album="" data-cover=""><div class="cov"><div class="cov-ph">${esc(PREF.directIcon||'⌕')}</div>${playBtn(esc(t('tile.dlread')))}</div><h3>${esc(q)}</h3><p>${esc(t('search.direct_artist'))}</p></div>`;}
async function doSearch(q){if(!q.trim())return;lastQ=q;S.search=[];$('#sres').innerHTML=directTile(q)+'<div class="empty">'+t('search.searching')+'</div>';try{const r=await fetch('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q})});S.search=await r.json();$('#sres').innerHTML=directTile(q)+(S.search.length?S.search.map(tileHTML).join(''):`<div class="empty">${t('search.none')}</div>`);reveal(S._nav);}catch(e){$('#sres').innerHTML=directTile(q)+`<div class="empty">${t('t.fail')}${esc(e.message)}</div>`;}}
function renderLibrary(){let ready=S.lib.tracks.filter(x=>x.status==='ready');const dl=S.lib.tracks.filter(x=>x.status!=='ready');if(S.libFilter==='fav')ready=ready.filter(x=>x.fav);if(S.libQ){const q=norm(S.libQ);ready=ready.filter(x=>norm(x.title+' '+x.artist).includes(q))}if(S.libSort==='title')ready=[...ready].sort((a,b)=>a.title.localeCompare(b.title));else if(S.libSort==='artist')ready=[...ready].sort((a,b)=>a.artist.localeCompare(b.artist));else if(S.libSort==='duration')ready=[...ready].sort((a,b)=>(a.duration||0)-(b.duration||0));S.viewTracks=ready;S._libList=ready;$('#view').innerHTML=`<div class="view-head"><h2>${t('lib.title')}</h2><div class="head-actions"><button class="btn ghost" id="selToggle"><svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>${S.selectMode?t('lib.cancel_sel'):t('lib.select')}</button><button class="btn ghost" id="upl"><svg viewBox="0 0 24 24"><path d="M12 3v12m0-12 4 4m-4-4-4 4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>${t('lib.local')}</button></div></div><input type="file" id="filein" accept="audio/*" multiple hidden><div class="toolbar"><button class="chip ${S.libFilter==='all'?'active':''}" data-filter="all">${t('lib.all')}</button><button class="chip ${S.libFilter==='fav'?'active':''}" data-filter="fav"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.9-10-9.3C.4 8.6 2 5 5.5 5c2 0 3.4 1.1 4.5 2.6C11.1 6.1 12.5 5 14.5 5 18 5 19.6 8.6 22 11.7 19.5 16.1 12 21 12 21z"/></svg>${t('lib.favs')}</button><input class="chip" id="libq" placeholder="${esc(t('lib.filter_ph'))}" value="${esc(S.libQ)}" style="min-width:140px"><select class="chip" id="libsort" style="margin-left:auto"><option value="recent" ${S.libSort==='recent'?'selected':''}>${t('lib.sort_recent')}</option><option value="title" ${S.libSort==='title'?'selected':''}>${t('lib.sort_title')}</option><option value="artist" ${S.libSort==='artist'?'selected':''}>${t('lib.sort_artist')}</option><option value="duration" ${S.libSort==='duration'?'selected':''}>${t('lib.sort_dur')}</option></select></div>${S.selectMode?selBarHTML():''}${dl.length?`<div class="hint">${t('lib.dl_progress')}${dl.length}</div>`:''}<div class="list">${ready.map((x,i)=>rowHTML(x,i)).join('')||`<div class="empty">${t('lib.empty')}</div>`}</div>`;const lq=$('#libq');if(lq){lq.oninput=()=>{S.libQ=lq.value;renderLibrary()};lq.setSelectionRange(lq.value.length,lq.value.length)}updateSelBar();}
function selBarHTML(){return `<div class="selbar"><span class="cnt"><b id="selcount">0</b> ${t('selbar.selected')}</span><button class="chip" data-sel="all">${t('selbar.all')}</button><button class="chip" data-sel="none">${t('selbar.none')}</button><button class="btn danger" data-sel="del"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2m-9 0v14a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V6"/></svg>${t('selbar.delete')} (<span id="selcount2">0</span>)</button><span class="spacer"></span><button class="chip" data-sel="cancel">${t('selbar.cancel')}</button></div>`}

    var d=P().discord||{};var title=tr.title||'—';var artist=tr.artist||'';var album=tr.album||'';var app=d.appName||'Melodify';
    var by=TT('rpc.by'),on=TT('rpc.on');var tpl=d.template||'spot';var details=title;var state;if(artist){state=by+' '+artist;}else if(album){state=on+' '+album;}else{state=app;}
    if(tpl==='a_t'){details=artist||title;state=title;}else if(tpl==='t'){details=title;state=app;}else if(tpl==='a'){details=artist||app;state=app;}
    var act={type:2,details:details,state:state,timestamps:{start:Math.floor(Date.now()/1000-(A.currentTime||0))}};
    var assets={};if(d.cover!==false){var cov=tr.cover||'';if(isHttp(cov)){assets.large_image=cov;}}
    assets.large_text=title+q(artist,' — '+artist,'')+q(album,' · '+album,'');act.assets=assets;return act;}
  function pushRpc(){if(!(P().discord&&P().discord.on)){return;}var act=buildActivity();if(act){rpcSend(act);}}
  function flashCard(){var c=document.querySelector('.rpc-card');if(c){c.classList.add('flash');setTimeout(function(){c.classList.remove('flash');},420);}refreshPrev();}
  function refreshPrev(){
    var card=document.querySelector('.rpc-card');if(!card){return;}
    var tr=curTrack();var d=P().discord||{};var app=d.appName||'Melodify';
    var h=card.querySelector('.rpc-h span:last-child');if(h){h.textContent=app;}
    var tEl=card.querySelector('.rpc-title'),sEl=card.querySelector('.rpc-state'),cov=card.querySelector('.rpc-covwrap');
    if(!tr){if(tEl){tEl.textContent='—';}if(sEl){sEl.textContent=' ';}if(cov){cov.innerHTML='<div class="rpc-cov-ph">♪</div>';}return;}
    var title=tr.title||'—';var artist=tr.artist||'';var album=tr.album||'';var by=TT('rpc.by'),onw=TT('rpc.on');var tpl=d.template||'spot';var details=title;var state;if(artist){state=by+' '+artist;}else if(album){state=onw+' '+album;}else{state=app;}
    if(tpl==='a_t'){details=artist||title;state=title;}else if(tpl==='t'){details=title;state=app;}else if(tpl==='a'){details=artist||app;state=app;}
    if(tEl){tEl.textContent=details;}if(sEl){sEl.textContent=state;}
    if(cov){var c2=tr.cover||'';if(d.cover!==false&&isHttp(c2)){cov.innerHTML='<img class="rpc-cov" src="'+c2+'" alt="">';}else{cov.innerHTML='<div class="rpc-cov-ph">♪</div>';}}}

  function statsShell(){return '<div class="set-group in" id="grpStats"><h3>'+TT('stats.title')+'</h3><div class="gsub">'+TT('stats.sub')+'</div>'+
    '<div class="st-controls"><div class="st-chips" id="stChips"><button data-st="session"><span class="st-live"></span>'+TT('stats.session')+'</button><button data-st="week">'+TT('stats.week')+'</button><button data-st="month">'+TT('stats.month')+'</button></div>'+
    '<select class="st-sel" id="stDetail"></select>'+
    '<div class="st-chips"><button data-stunit="auto">'+TT('stats.auto')+'</button><button data-stunit="m">'+TT('stats.min')+'</button><button data-stunit="h">'+TT('stats.h')+'</button></div>'+
    '<button class="switch '+q(ui.anims!==false,'on','')+'" data-st="anims" title="'+TT('stats.anims')+'" style="margin-left:auto"></button>'+
    '<button class="btn ghost" data-st="export" style="padding:8px 12px;font-size:11px">'+TT('stats.export')+'</button>'+
    '<button class="btn ghost" data-st="import" style="padding:8px 12px;font-size:11px">'+TT('stats.import')+'</button></div>'+
    '<div id="statsBody"></div></div>';}
  function injectStats(){var v=document.getElementById('view');if(!v){return;}var old=document.getElementById('grpStats');if(old){old.remove();}v.insertAdjacentHTML('beforeend',statsShell());
    var nav=document.querySelector('.setnav .snchips');if(nav&&!nav.querySelector('[data-goto="grpStats"]')){var b=document.createElement('button');b.className='snchip';b.setAttribute('data-goto','grpStats');b.textContent=TT('stats.title');nav.appendChild(b);b.onclick=function(){var g=document.getElementById('grpStats');var sc=document.getElementById('view');if(g&&sc&&window.smoothScrollTo){window.smoothScrollTo(sc,g.offsetTop-24,420);}};}
    buildSelect();renderStatsBody(ui.anims!==false&&!reduceOn());syncControls();}
  function injectDisp(){var v=document.getElementById('view');if(!v){return;}var old=document.getElementById('grpDisp');if(old){old.remove();}v.insertAdjacentHTML('beforeend',dispHTML());
    var nav=document.querySelector('.setnav .snchips');if(nav&&!nav.querySelector('[data-goto="grpDisp"]')){var b=document.createElement('button');b.className='snchip';b.setAttribute('data-goto','grpDisp');b.textContent=TT('disp.title');nav.appendChild(b);b.onclick=function(){var g=document.getElementById('grpDisp');var sc=document.getElementById('view');if(g&&sc&&window.smoothScrollTo){window.smoothScrollTo(sc,g.offsetTop-24,420);}};}}
  function injectDisc(){var v=document.getElementById('view');if(!v){return;}var old=document.getElementById('grpDisc');if(old){old.remove();}v.insertAdjacentHTML('beforeend',discHTML());
    var nav=document.querySelector('.setnav .snchips');if(nav&&!nav.querySelector('[data-goto="grpDisc"]')){var b=document.createElement('button');b.className='snchip';b.setAttribute('data-goto','grpDisc');b.textContent=TT('rpc.title');nav.appendChild(b);b.onclick=function(){var g=document.getElementById('grpDisc');var sc=document.getElementById('view');if(g&&sc&&window.smoothScrollTo){window.smoothScrollTo(sc,g.offsetTop-24,420);}};}
    refreshPrev();}
  function setLyrCovMax(){var r=document.querySelector('#lyrCovR');if(r){r.max='160';}}
  function injectAll(){injectDisp();injectDisc();injectStats();injectOffsetRow();setLyrCovMax();}

  if(typeof window.savePrefs==='function'){var _sp=window.savePrefs;window.savePrefs=function(){var r=_sp.apply(this,arguments);try{saveExtra();}catch(e){}return r;};}
  if(typeof window.renderSettings==='function'){var _rs=window.renderSettings;window.renderSettings=function(){try{_rs.apply(this,arguments);}catch(e){}injectAll();};}
  if(typeof window.playCurrent==='function'){var _pc=window.playCurrent;window.playCurrent=function(){var r;try{r=_pc.apply(this,arguments);}catch(e){}try{pushRpc();flashCard();applyPulsePref();glowAmbient(curTrack());if(document.getElementById('grpStats')){renderStatsBody(false);}}catch(e){}return r;};}
  if(typeof window.toggleOverlay==='function'){var _to=window.toggleOverlay;window.toggleOverlay=function(){var r=_to.apply(this,arguments);try{applyPulsePref();removeOverlayOffset();}catch(e){}return r;};}
  if(typeof window.smoothScrollTo==='function'){var _ssw=window.smoothScrollTo;window.smoothScrollTo=function(el,to,dur){window.__lyrProgScroll=true;clearTimeout(window.__lyrProgScrollT);window.__lyrProgScrollT=setTimeout(function(){window.__lyrProgScroll=false;},900);return _ssw.apply(this,arguments);};}
  var _lb=document.querySelector('#lyricsBody');
  if(_lb){_lb.addEventListener('scroll',function(e){if(window.__lyrProgScroll){e.stopImmediatePropagation();var o=document.getElementById('lyricsOverlay');if(o&&P().lyrAutohide!==false){o.classList.add('idle');}}},true);}
  window.addEventListener('pywebviewready',function(){rpcConfigure();if(P().discord&&P().discord.on){pushRpc();}if(P().duck&&P().duck.sys){sysduckCmd(true);}});

  var viewEl=document.getElementById('view');
  if(viewEl){
    viewEl.addEventListener('click',function(e){
      var u=e.target.closest('[data-stunit]');if(u){ui.unit=u.getAttribute('data-stunit');statsSave();renderStatsBody(false);syncControls();return;}
      var st=e.target.closest('[data-st]');if(st){var k=st.getAttribute('data-st');
        if(k==='anims'){ui.anims=!(ui.anims!==false);st.classList.toggle('on',ui.anims!==false);statsSave();renderStatsBody(false);return;}
        if(k==='export'){doExport();return;}
        if(k==='import'){doImport();return;}
        if(k==='session'){setRange({type:'session'});}
        else if(k==='week'){setRange({type:'week',key:mondayOf(todayKey())});}
        else if(k==='month'){setRange({type:'month',key:ymOf(todayKey())});}
        return;}
      var mo=e.target.closest('[data-more]');if(mo){var mk=mo.getAttribute('data-more');if(moreN[mk]>=20){moreN[mk]=Infinity;}else{moreN[mk]=moreN[mk]+5;}renderStatsBody(false);return;}
      var ofr=e.target.closest('[data-off]');if(ofr&&ofr.getAttribute('data-off')==='reset'){setOffset(0);return;}
      var gl=e.target.closest('[data-glow]');if(gl){var gk=gl.getAttribute('data-glow');P().glowmode=P().glowmode||{};if(gk==='on'){P().glowmode.on=!P().glowmode.on;}else if(gk==='ambient'){P().glowmode.ambient=!P().glowmode.ambient;}else if(gk==='reactive'){P().glowmode.reactive=!P().glowmode.reactive;}gl.classList.toggle('on',!!P().glowmode[gk]);applyGlow();if(gk==='ambient'&&P().glowmode.ambient){glowAmbient(curTrack());}save();return;}
      var sw=e.target.closest('[data-disp]');if(sw){var id=sw.getAttribute('data-disp');var c=null;CFG.forEach(function(sec){sec[1].forEach(function(x){if(x[0]===id){c=x;}});});if(c){toggleDisp(c);sw.classList.toggle('on',getOn(c));}return;}
      var da=e.target.closest('[data-disp-act]');if(da&&da.getAttribute('data-disp-act')==='reset'){resetDisp();return;}
      var dc=e.target.closest('[data-disc]');if(dc){var dk=dc.getAttribute('data-disc');P().discord=P().discord||{};P().pulse=P().pulse||{};P().duck=P().duck||{};
        if(dk==='on'){P().discord.on=!P().discord.on;dc.classList.toggle('on',P().discord.on);rpcConfigure();if(P().discord.on){pushRpc();}else{rpcClear();}save();}
        else if(dk==='cover'){P().discord.cover=!P().discord.cover;dc.classList.toggle('on',P().discord.cover);refreshPrev();if(P().discord.on){pushRpc();}save();}
        else if(dk==='pulse_on'){P().pulse.on=!P().pulse.on;dc.classList.toggle('on',P().pulse.on);applyPulsePref();save();}
        else if(dk==='pulse_fx'){P().pulse.fx=!(P().pulse.fx!==false);dc.classList.toggle('on',P().pulse.fx!==false);save();}
        else if(dk==='pulse_cg'){P().pulse.coverglow=!(P().pulse.coverglow!==false);dc.classList.toggle('on',P().pulse.coverglow!==false);save();}
        else if(dk==='mic_on'){P().duck.mic=!P().duck.mic;dc.classList.toggle('on',P().duck.mic);if(P().duck.mic){startMic();}else{stopMic();}save();}
        else if(dk==='sys_on'){P().duck.sys=!P().duck.sys;dc.classList.toggle('on',P().duck.sys);sysduckCmd(P().duck.sys);if(!P().duck.sys){window.__sysDuckActive=false;window.__sysDuck=1;}save();}
        return;}
      var act=e.target.closest('[data-disc-act]');if(act&&act.getAttribute('data-disc-act')==='test'){var a=buildActivity();if(a){rpcSend(a);flashCard();if(typeof toast==='function'){toast(TT('rpc.test_ok'));}}else if(typeof toast==='function'){toast(TT('rpc.test_need'));}}
    });
    viewEl.addEventListener('change',function(e){var t2=e.target;if(!t2.getAttribute){return;}
      var sel=t2.getAttribute('data-disc-sel');if(sel){P().pulse=P().pulse||{};P().discord=P().discord||{};
        if(sel==='template'){P().discord.template=t2.value;refreshPrev();if(P().discord.on){pushRpc();}}
        else if(sel==='pulse_style'){P().pulse.style=t2.value;}
        else if(sel==='pulse_color'){P().pulse.color=t2.value;}
        save();return;}
      if(t2.id==='stDetail'){var v=t2.value;if(v==='session'){setRange({type:'session'});}else if(v.indexOf('week:')===0){setRange({type:'week',key:v.slice(5)});}else if(v.indexOf('month:')===0){setRange({type:'month',key:v.slice(7)});}else if(v.indexOf('past:')===0){setRange({type:'sessionPast',idx:+v.slice(5)});}}
    });
    viewEl.addEventListener('input',function(e){var t2=e.target;if(!t2.getAttribute){return;}
      if(t2.hasAttribute('data-off-range')){setOffset(+t2.value);return;}
      var gl=t2.getAttribute('data-glow');if(gl){P().glowmode=P().glowmode||{};if(gl==='col'){P().glowmode.col=t2.value;}else if(gl==='int'){P().glowmode.int=+t2.value;var sm=t2.closest('.set-row').querySelector('small');if(sm){sm.textContent=P().glowmode.int;}}applyGlow();save();return;}
      var di=t2.getAttribute('data-disc-in');if(di){P().discord=P().discord||{};P().discord[di]=t2.value;if(di==='clientId'){cidWrite(t2.value);rpcConfigure();}if(di==='appName'){refreshPrev();}if(P().discord.on){pushRpc();}save();return;}
      var dr=t2.getAttribute('data-disc-range');if(dr){var sm=t2.closest('.set-row').querySelector('small');P().pulse=P().pulse||{};P().duck=P().duck||{};
        if(dr==='pulse_int'){P().pulse.intensity=+t2.value;if(sm){sm.textContent=P().pulse.intensity+' %';}}
        else if(dr==='pulse_op'){P().pulse.opacity=+t2.value;if(sm){sm.textContent=P().pulse.opacity+' %';}}
        else if(dr==='pulse_kick'){P().pulse.kick=+t2.value;if(sm){sm.textContent=P().pulse.kick;}}
        else if(dr==='mic_pct'){P().duck.micPct=+t2.value;if(sm){sm.textContent=P().duck.micPct+' %';}}
        else if(dr==='mic_thr'){P().duck.micThr=+t2.value;if(sm){sm.textContent=P().duck.micThr;}}
        else if(dr==='sys_pct'){P().duck.sysPct=+t2.value;if(sm){sm.textContent=P().duck.sysPct+' %';}}
        save();return;}
      var ddr=t2.getAttribute('data-disp-range');if(ddr==='volDelay'){P().volDelay=+t2.value;var sm2=t2.closest('.set-row').querySelector('small');if(sm2){sm2.textContent=fmtDelay(P().volDelay);}save();return;}
    });
    viewEl.addEventListener('focusout',function(e){var t2=e.target;if(t2&&t2.getAttribute&&t2.getAttribute('data-disc-in')==='clientId'){cidWrite(t2.value);save();}},true);
  }

  setInterval(function(){if(document.getElementById('grpDisc')){refreshDuckUI();}},700);
  setInterval(function(){if(document.getElementById('grpStats')&&ui.range.type==='session'){updateKpiLive();}},3000);

  applyDisplayPrefs();
  removeOverlayOffset();
  if(P().pulse&&P().pulse.on){applyPulsePref();}
  if(P().duck&&P().duck.mic){startMic();}
  if(P().duck&&P().duck.sys){sysduckCmd(true);}
  paintVol();
  setTimeout(function(){ try{ var p=P();
    var raw=localStorage.getItem('melodify_toggles'); if(raw){ var o=JSON.parse(raw);
      if(o.discord){ p.discord=Object.assign({},p.discord||{},o.discord); }
      if(o.pulse){ p.pulse=Object.assign({},p.pulse||{},o.pulse); }
      if(o.duck){ p.duck=Object.assign({},p.duck||{},o.duck); }
      if(o.glowmode){ p.glowmode=Object.assign({},p.glowmode||{},o.glowmode); }
      if(o.hideUI){ p.hideUI=Object.assign({},p.hideUI||{},o.hideUI); }
      ['shine','glow','coverpop','reveal','ambDrift','idleAnim','autoEconomy','sleepOnBlur','forceAwake','fpsCap','showPos','showRemaining','lyrProg','volAutoHide','volDelay','lyrOffset','noambient'].forEach(function(k){if(o[k]!==undefined){p[k]=o[k];}});
      window.__lyrOff=(p.lyrOffset||0);
      applyDisplayPrefs();
      if(p.discord&&p.discord.on){rpcConfigure();pushRpc();}
      if(p.duck&&p.duck.mic){startMic();} if(p.duck&&p.duck.sys){sysduckCmd(true);}
    } }catch(e){} },700);
})();
</script>
